# Server Configuration
api.version=v1
server.servlet.context-path=/api/${api.version}
server.port=${SERVER_PORT:8080}

# Master Database Configurations
# Credentials MUST be provided via environment variables in production
spring.datasource.url=${DB_MASTER_URL:jdbc:postgresql://localhost:5432/awais_hr_master}
spring.datasource.username=${DB_MASTER_USERNAME:postgres}
spring.datasource.password=${DB_MASTER_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dedicated Observability Database Configuration (Isolated from HR Tenant DBs)
observability.datasource.enabled=${OBSERVABILITY_DB_ENABLED:true}
observability.datasource.url=${DB_OBSERVABILITY_URL:jdbc:postgresql://localhost:5432/awais_hr_observability}
observability.datasource.username=${DB_OBSERVABILITY_USERNAME:postgres}
observability.datasource.password=${DB_OBSERVABILITY_PASSWORD:root}
observability.datasource.hikari.maximum-pool-size=15

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
# NOTE: show-sql and format_sql must be false in production for performance and security
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Flyway Configuration (Master Context)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/master
spring.flyway.clean-disabled=true

# Logging levels
# In production: set org.springframework.security to WARN
# In development: DEBUG is acceptable
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}
logging.level.org.springframework.jdbc.core.JdbcTemplate=${LOG_LEVEL_JDBC:WARN}
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO

# Tenant Database Default Provisioning Configurations
# Credentials MUST be provided via environment variables in production
tenant.datasource.url-prefix=${TENANT_DB_URL_PREFIX:jdbc:postgresql://localhost:5432/}
tenant.datasource.username=${TENANT_DB_USERNAME:postgres}
tenant.datasource.password=${TENANT_DB_PASSWORD:root}

# Redis Cache Configurations
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

# ===================================================================
# ENTERPRISE OBSERVABILITY PLATFORM CONFIGURATION
# ===================================================================

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers,httpexchanges,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Prometheus Metrics & Histogram Configuration
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s
management.metrics.tags.application=awais-hr-backend
management.metrics.tags.environment=${APP_ENVIRONMENT:production}
management.metrics.tags.region=${APP_REGION:us-east-1}
management.metrics.tags.service=hr-engine

# OpenTelemetry Distributed Tracing & Tempo Exporter Configuration
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c,b3
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
management.otlp.tracing.transport=http
