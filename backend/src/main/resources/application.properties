# Server Configuration
api.version=v1
server.servlet.context-path=/api/${api.version}
server.port=${SERVER_PORT:8080}
spring.threads.virtual.enabled=true

# Master Database Configurations
# Credentials MUST be provided via environment variables in production
spring.datasource.url=${DB_MASTER_URL:jdbc:mysql://localhost:3306/awais_hr_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_MASTER_USERNAME:root}
spring.datasource.password=${DB_MASTER_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dedicated Observability Database Configuration (Isolated from HR Tenant DBs)
observability.datasource.enabled=${OBSERVABILITY_DB_ENABLED:true}
observability.datasource.url=${DB_OBSERVABILITY_URL:jdbc:mysql://localhost:3306/awais_hr_observability?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
observability.datasource.username=${DB_OBSERVABILITY_USERNAME:root}
observability.datasource.password=${DB_OBSERVABILITY_PASSWORD:root}
observability.datasource.hikari.maximum-pool-size=15

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Flyway Configuration (Master Context)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/master
spring.flyway.clean-disabled=true

# Logging levels (Simple, clean, completely silenced SQL query dumps)
logging.level.root=INFO
logging.level.com.awais.hr=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.jdbc=WARN
logging.level.org.springframework.jdbc.core.JdbcTemplate=WARN
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=WARN


# Tenant Database Default Provisioning Configurations
# Credentials MUST be provided via environment variables in production
tenant.datasource.url-prefix=${TENANT_DB_URL_PREFIX:jdbc:mysql://localhost:3306/}
tenant.datasource.username=${TENANT_DB_USERNAME:root}
tenant.datasource.password=${TENANT_DB_PASSWORD:root}

# Redis Cache Configurations
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

# ===================================================================
# ENTERPRISE OBSERVABILITY PLATFORM CONFIGURATION
# ===================================================================

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers,httpexchanges,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Prometheus Metrics & Histogram Configuration
# Note: only low-cardinality global tags — per-tenant/per-plan labels on individual metrics only
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.sla.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s
management.metrics.tags.application=awais-hr-backend
management.metrics.tags.environment=${APP_ENVIRONMENT:production}
management.metrics.tags.service=hr-engine

# OpenTelemetry Distributed Tracing & Tempo Exporter Configuration
# Enabled at 10% sampling — increase TRACING_SAMPLING env var for higher coverage
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:awais_hr_enterprise_secure_jwt_token_secret_key_256_bits_long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

