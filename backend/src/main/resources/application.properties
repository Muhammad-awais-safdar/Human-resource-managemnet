# Server Configuration
api.version=v1
server.servlet.context-path=/api/${api.version}
server.port=8080

# Master Database Configurations
spring.datasource.url=jdbc:postgresql://localhost:5432/awais_hr_master?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Dedicated Observability Database Configuration (Isolated from HR Tenant DBs)
observability.datasource.enabled=true
observability.datasource.url=jdbc:postgresql://localhost:5432/awais_hr_observability
observability.datasource.username=postgres
observability.datasource.password=root
observability.datasource.hikari.maximum-pool-size=15

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Flyway Configuration (Master Context)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/master
spring.flyway.clean-disabled=true

# Logging levels
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO

# Tenant Database Default Provisioning Configurations
tenant.datasource.url-prefix=jdbc:postgresql://localhost:5432/
tenant.datasource.username=postgres
tenant.datasource.password=root

# Redis Cache Configurations
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# ===================================================================
# ENTERPRISE OBSERVABILITY PLATFORM CONFIGURATION
# ===================================================================

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers,httpexchanges,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Prometheus Metrics & Histogram Configuration
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s
management.metrics.tags.application=awais-hr-backend
management.metrics.tags.environment=production
management.metrics.tags.region=us-east-1
management.metrics.tags.service=hr-engine

# OpenTelemetry Distributed Tracing & Tempo Exporter Configuration
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c,b3
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
management.otlp.tracing.transport=http

