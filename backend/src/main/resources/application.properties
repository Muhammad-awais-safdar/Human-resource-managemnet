# Server Configuration
api.version=v1
server.servlet.context-path=/api/${api.version}
server.port=8080

# Master Database Configurations
spring.datasource.url=jdbc:postgresql://localhost:5432/awais_hr_master?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Dedicated Observability Database Configuration (Isolated from HR Tenant DBs)
observability.datasource.enabled=true
observability.datasource.url=jdbc:postgresql://localhost:5432/awais_hr_observability
observability.datasource.username=postgres
observability.datasource.password=root
observability.datasource.hikari.maximum-pool-size=15

# JPA & Hibernate Settings (N+1 Query Prevention & Batch Processing)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Flyway Configuration (Master Context)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/master
spring.flyway.clean-disabled=true

# Logging levels & SQL Query Exclusions
logging.console.level=INFO
logging.level.com.awais.hr=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.springframework.jdbc.core.JdbcTemplate=OFF
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF

# Tenant Database Default Provisioning Configurations
tenant.datasource.url-prefix=jdbc:postgresql://localhost:5432/
tenant.datasource.username=postgres
tenant.datasource.password=root

# Redis Cache Configurations
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# ===================================================================
# ENTERPRISE OBSERVABILITY PLATFORM & GRAFANA KILL SWITCH
# ===================================================================

# Master Kill Switch: Enable/Disable Grafana & OpenTelemetry Stack Exporting
# - Set to 'true': Stream all metrics & traces to Grafana / Loki / Tempo.
# - Set to 'false': Disable Grafana export noise and print all app logs cleanly to Terminal.
observability.grafana.enabled=false

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers,httpexchanges,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Prometheus Metrics & Histogram Configuration
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s
management.metrics.tags.application=awais-hr-backend
management.metrics.tags.environment=production
management.metrics.tags.region=us-east-1
management.metrics.tags.service=hr-engine

# OpenTelemetry Distributed Tracing & Tempo Exporter Configuration
management.tracing.enabled=${observability.grafana.enabled}
management.tracing.sampling.probability=0.0
management.tracing.propagation.type=w3c,b3
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.transport=http
logging.level.io.opentelemetry=OFF



