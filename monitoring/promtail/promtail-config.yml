server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  # ── Docker socket discovery ──────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # container name without leading slash
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'container'

      # map known container names to a clean service label
      - source_labels: ['container']
        regex: 'awais-hr-(backend|frontend|db|redis|prometheus|grafana|loki|tempo|alertmanager|cadvisor|node-exporter|promtail|postgres-exporter|redis-exporter)'
        target_label: 'service'
        replacement: '${1}'

      # static environment label
      - target_label: 'environment'
        replacement: 'production'

    pipeline_stages:
      # ── BACKEND: parse structured JSON log lines ─────────────────────
      - match:
          selector: '{container="awais-hr-backend"}'
          stages:
            - json:
                expressions:
                  level:    'level'
                  logger:   'logger'
                  traceId:  'traceId'
                  message:  'message'
                  endpoint: 'requestUri'
            - labels:
                level:
            # ── LAYER 3: Drop infrastructure/health/metrics lines at Promtail ──
            # These should already be absent because ApiLoggingFilter.shouldNotFilter()
            # prevents them from reaching the logger. This is the final safety net.
            - drop:
                expression: '.*(actuator/health|actuator/prometheus|/health|/ping|/ready|/liveness|/readiness)\s.*'
            - drop:
                expression: '.*\[API (REQUEST|RESPONSE)\].*actuator.*'

      # ── PLAIN TEXT: extract log level for non-backend containers ─────
      - match:
          selector: '{container=~"awais-hr-.*"}'
          stages:
            - regex:
                expression: '.*\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+.*'
            - labels:
                level:

      # ── DROP: DEBUG and TRACE — never needed in production Loki ─────
      - match:
          selector: '{level=~"DEBUG|TRACE"}'
          action: drop

      # ── DROP: monitoring-system internal logs from non-app containers ─
      # Prometheus, Grafana, Loki, Tempo, cAdvisor logs are infrastructure.
      # They are ingested in their own stream but excluded from app log queries.
      - match:
          selector: '{container=~"awais-hr-(prometheus|grafana|loki|tempo|alertmanager|cadvisor|promtail|node-exporter|postgres-exporter|redis-exporter)"}'
          stages:
            - labels:
                log_type: 'infrastructure'

  # ── Fallback: container log files on disk ───────────────────────────
  - job_name: container-logs-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          environment: production
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - json:
          expressions:
            stream: stream
            log: log
      - labels:
          stream:
      - regex:
          source: log
          expression: '.*\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+.*'
      - labels:
          level:
      # Drop actuator/health from file-based log stream too
      - drop:
          expression: '.*(actuator/health|actuator/prometheus|/ping|/ready|/liveness)\s.*'
