server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  # ── Docker socket discovery ──────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # container name without leading slash
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'container'

      # map our known container names to a clean service label
      - source_labels: ['container']
        regex: 'awais-hr-(backend|frontend|db|redis|prometheus|grafana|loki|tempo|alertmanager|cadvisor|node-exporter|promtail|postgres-exporter|redis-exporter)'
        target_label: 'service'
        replacement: '${1}'

      # static labels
      - target_label: 'environment'
        replacement: 'production'

    pipeline_stages:
      # ── backend JSON structured logs ──────────────────────────────────
      - match:
          selector: '{container="awais-hr-backend"}'
          stages:
            # Try to parse JSON first (for structured log lines)
            - json:
                expressions:
                  level: 'level'
                  logger: 'logger'
                  traceId: 'traceId'
                  requestId: 'requestId'
                  message: 'message'
            - labels:
                level:

      # ── plain text log level extraction (fallback for non-JSON lines) ─
      - match:
          selector: '{container=~"awais-hr-.*"}'
          stages:
            - regex:
                expression: '.*\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+.*'
            - labels:
                level:

      # ── Drop noisy DEBUG/TRACE in production ─────────────────────────
      - match:
          selector: '{level=~"DEBUG|TRACE"}'
          action: drop

  # ── Fallback: all container log files on disk ────────────────────────
  - job_name: container-logs-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          environment: production
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - json:
          expressions:
            stream: stream
            attrs: attrs
            log: log
      - labels:
          stream:
      # extract log level from the nested log string
      - regex:
          source: log
          expression: '.*\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+.*'
      - labels:
          level:
