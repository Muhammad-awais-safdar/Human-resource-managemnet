apiVersion: 1

datasources:
  - name: Prometheus
    uid:  prometheus-ds
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    uid:  loki-ds
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    isDefault: false
    version: 1
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        - datasourceUid: tempo-ds
          matcherRegex: 'traceId=(\w+)'
          name: TraceID
          url: '$${__value.raw}'
          urlDisplayLabel: 'View Trace in Tempo'

  - name: Tempo
    uid:  tempo-ds
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    isDefault: false
    version: 1
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus-ds
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki-ds
      tracesToLogs:
        datasourceUid: loki-ds
        tags: ['service', 'container']
        mappedTags:
          - key: 'service.name'
            value: 'service'
        mapTagNamesEnabled: true
        spanStartTimeShift: '-15m'
        spanEndTimeShift:   '15m'
        filterByTraceID:    true
        filterBySpanID:     false
      tracesToMetrics:
        datasourceUid: prometheus-ds
        tags: ['service', 'job']
