groups:
  # ────────────────────────────────────────────────────────────────────
  # Infrastructure Alerts
  # ────────────────────────────────────────────────────────────────────
  - name: InfrastructureAlerts
    rules:
      - alert: BackendDown
        expr: up{job="awais-hr-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HRM Backend is DOWN"
          description: "The Spring Boot backend has been unreachable for more than 1 minute."

      - alert: HighCPUUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage on {{ $labels.instance }}"
          description: "CPU usage has been above 85% for 5 minutes. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: HighMemoryUsage
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High Memory Usage on {{ $labels.instance }}"
          description: "Host memory usage is above 90%. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: DiskSpaceWarning
        expr: ((node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk Space Warning on {{ $labels.instance }}"
          description: "Root disk is above 80% full. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: DiskSpaceCritical
        expr: ((node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 93
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk Space Critical on {{ $labels.instance }}"
          description: "Root disk is above 93% full. Current: {{ $value | printf \"%.1f\" }}% — immediate action required."

  # ────────────────────────────────────────────────────────────────────
  # Core Service Availability
  # ────────────────────────────────────────────────────────────────────
  - name: CoreServiceAlerts
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0 or up{job="postgres-exporter"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Database is DOWN"
          description: "The PostgreSQL database exporter is reporting the database as unreachable."

      - alert: RedisDown
        expr: redis_up == 0 or up{job="redis-exporter"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis Cache is DOWN"
          description: "The Redis cache instance is unreachable."

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Loki Log Aggregation is DOWN"
          description: "The Loki log ingestion service is unreachable. Logs are not being collected."

      - alert: TempoDown
        expr: up{job="tempo"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Tempo Distributed Tracing is DOWN"
          description: "The Tempo tracing receiver is unreachable."

  # ────────────────────────────────────────────────────────────────────
  # Application Performance
  # ────────────────────────────────────────────────────────────────────
  - name: ApplicationPerformanceAlerts
    rules:
      - alert: HighHTTP5xxErrorRate
        expr: >
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx Error Rate"
          description: "HTTP 5xx error rate is above 5%. Current: {{ $value | printf \"%.2f\" }}%"

      - alert: HighAPILatencyP95
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API Latency (P95 > 2s)"
          description: "95th percentile API latency is above 2 seconds. Current P95: {{ $value | printf \"%.2f\" }}s"

      - alert: HighJVMHeapUsage
        expr: >
          (
            sum(jvm_memory_used_bytes{area="heap"})
            /
            sum(jvm_memory_max_bytes{area="heap"})
          ) * 100 > 88
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "JVM Heap Memory Above 88%"
          description: "JVM Heap memory usage is critically high. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: HikariConnectionPoolSaturation
        expr: >
          (
            hikaricp_connections_active
            /
            hikaricp_connections_max
          ) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP Connection Pool Saturation"
          description: "HikariCP active connections exceed 85% of the pool max. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: HikariConnectionPoolExhausted
        expr: >
          (
            hikaricp_connections_active
            /
            hikaricp_connections_max
          ) * 100 > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP Connection Pool Exhausted"
          description: "HikariCP pool is at {{ $value | printf \"%.1f\" }}% capacity. New requests will be queued or rejected."

      - alert: HighGCPauseTime
        expr: rate(jvm_gc_pause_seconds_sum[5m]) > 0.3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated JVM GC Pause Time"
          description: "JVM GC pause rate exceeds 300ms/sec. GC is impacting throughput."

  # ────────────────────────────────────────────────────────────────────
  # Security Signals
  # ────────────────────────────────────────────────────────────────────
  - name: SecurityAlerts
    rules:
      - alert: HighAuthentication401Rate
        expr: >
          sum(rate(http_server_requests_seconds_count{status="401"}[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Rate of 401 Unauthorized Responses"
          description: "More than 10 unauthorized (401) requests per second for 2 minutes. Possible brute-force attack."

      - alert: ExcessiveForbiddenRequests
        expr: >
          sum(rate(http_server_requests_seconds_count{status="403"}[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Rate of 403 Forbidden Responses"
          description: "More than 5 forbidden (403) requests per second for 2 minutes."

  # ────────────────────────────────────────────────────────────────────
  # Container Health
  # ────────────────────────────────────────────────────────────────────
  - name: ContainerAlerts
    rules:
      - alert: ContainerRestarting
        expr: rate(container_last_seen{name=~"awais-hr-.*"}[5m]) > 0 and changes(container_start_time_seconds{name=~"awais-hr-.*"}[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container Repeatedly Restarting: {{ $labels.name }}"
          description: "Container {{ $labels.name }} has restarted more than 2 times in the last 15 minutes."

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name=~"awais-hr-(backend|db).*"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container High CPU: {{ $labels.name }}"
          description: "Container {{ $labels.name }} CPU usage is above 80%. Current: {{ $value | printf \"%.1f\" }}%"
