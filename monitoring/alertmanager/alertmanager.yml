global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'backend-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'backend-webhook'
      continue: false
    - match:
        severity: warning
      receiver: 'backend-webhook'

# ── Receivers ────────────────────────────────────────────────────────
# Route alerts to the backend internal webhook.
# For production, replace or add Slack/PagerDuty/email receivers via env vars.
receivers:
  - name: 'backend-webhook'
    webhook_configs:
      - url: 'http://backend:8080/api/v1/observability/alerts/webhook'
        send_resolved: true
        max_alerts: 10

# ── Inhibition ───────────────────────────────────────────────────────
# Suppress warnings when a critical alert for the same service is firing
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
