services:
  postgres:
    image: postgres:16-alpine
    container_name: awais-hr-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-awais_hr_master}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5432}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - awais-hr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awais-hr-backend
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/awais_hr_master}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-root}
      - OBSERVABILITY_DATASOURCE_URL=${OBSERVABILITY_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/awais_hr_observability}
      - OBSERVABILITY_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - OBSERVABILITY_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-root}
      - TENANT_DATASOURCE_URL_PREFIX=${TENANT_DATASOURCE_URL_PREFIX:-jdbc:postgresql://postgres:5432/}
      - TENANT_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - TENANT_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-c2VjdXJlX2p3dF9zZWNyZXRfa2V5X2Zvcl9hd2Fpc19oci9lbnRlcnByaXNlX3NhYXNfcGxhdGZvcm0=}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - awais-hr-network

  redis:
    image: redis:7-alpine
    container_name: awais-hr-redis
    ports:
      - "${REDIS_HOST_PORT:-${REDIS_PORT:-6379}}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - awais-hr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: ${BACKEND_DOCKER_API_URL:-http://backend:8080}
    container_name: awais-hr-frontend
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - BACKEND_API_URL=${BACKEND_DOCKER_API_URL:-http://backend:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_VERSION=${NEXT_PUBLIC_API_VERSION:-v1}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - awais-hr-network

volumes:
  postgres_data:

networks:
  awais-hr-network:
    name: awais-hr-network
