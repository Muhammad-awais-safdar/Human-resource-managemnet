version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: awais-hr-db
    environment:
      POSTGRES_DB: awais_hr_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awais-hr-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/awais_hr_master
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - TENANT_DATASOURCE_URL_PREFIX=jdbc:postgresql://postgres:5432/
      - TENANT_DATASOURCE_USERNAME=postgres
      - TENANT_DATASOURCE_PASSWORD=root
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: awais-hr-frontend
    environment:
      - BACKEND_API_URL=http://backend:8080
      - NEXT_PUBLIC_API_VERSION=v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
