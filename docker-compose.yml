services:
  mysql:
    image: mysql:8.0
    container_name: awais-hr-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-awais_hr_master}
    ports:
      - "${MYSQL_HOST_PORT:-${MYSQL_PORT:-3306}}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - awais-hr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awais-hr-backend
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/awais_hr_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-root}
      - OBSERVABILITY_DATASOURCE_URL=${OBSERVABILITY_DATASOURCE_URL:-jdbc:mysql://mysql:3306/awais_hr_observability?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
      - OBSERVABILITY_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - OBSERVABILITY_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-root}
      - TENANT_DATASOURCE_URL_PREFIX=${TENANT_DATASOURCE_URL_PREFIX:-jdbc:mysql://mysql:3306/}
      - TENANT_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - TENANT_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-c2VjdXJlX2p3dF9zZWNyZXRfa2V5X2Zvcl9hd2Fpc19oci9lbnRlcnByaXNlX3NhYXNfcGxhdGZvcm0=}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - app_logs:/tmp/app-logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - awais-hr-network

  redis:
    image: redis:7-alpine
    container_name: awais-hr-redis
    ports:
      - "${REDIS_HOST_PORT:-${REDIS_PORT:-6379}}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - awais-hr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: ${BACKEND_DOCKER_API_URL:-http://backend:8080}
    container_name: awais-hr-frontend
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - BACKEND_API_URL=${BACKEND_DOCKER_API_URL:-http://backend:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_VERSION=${NEXT_PUBLIC_API_VERSION:-v1}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - awais-hr-network

volumes:
  mysql_data:
  app_logs:

networks:
  awais-hr-network:
    name: awais-hr-network
