[pytest]
markers =
    smoke: Smoke tests for critical endpoints
    api: API endpoint coverage tests
    ui: Playwright UI tests
    e2e: End to end workflow tests
    security: Security, auth, and IDOR tests
    rbac: Role based access control matrix tests
    tenant: Multi tenant boundary and isolation tests
    financial: Monetary and financial precision tests
    integration: System integration and webhook tests
    crud: Full CRUD lifecycle validation tests

